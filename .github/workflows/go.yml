name: Go

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      live:
        description: Run live TradingView integration tests
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Check module files
        run: go mod tidy -diff
      - name: Vet
        run: go vet ./...
      - name: Check modern Go idioms
        run: go fix -diff ./...
      - name: Test with race detection
        run: go test -race -shuffle=on -coverprofile=coverage.out ./...
      - name: Compile integration tests
        run: go test -tags=integration -run '^$' ./...
      - name: Fuzz response decoding
        if: runner.os == 'Linux'
        run: go test -run '^$' -fuzz '^FuzzGetContext$' -fuzztime=10s -parallel=2 ./...
      - name: Live TradingView integration tests
        if: github.event_name == 'workflow_dispatch' && inputs.live && runner.os == 'Linux'
        run: go test -tags=integration -run '^TestLive' -count=1 -timeout=2m -v ./...
